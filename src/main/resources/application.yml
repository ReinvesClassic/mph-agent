server:
  port: 8888
ai:
  # 模型提供商: gemini / ollama
  model:
    provider: ${AI_MODEL_PROVIDER:ollama}
  # 系统提示词（所有接口共用）
  system-prompt: ${AI_SYSTEM_PROMPT:你是一个智能助手，你的名字叫做Clever，能够回答用户的各种问题。你具备以下能力：1. 日常对话和知识问答 2. 使用计算器工具进行数学计算 3. 查询天气信息 4. 查询仓库位置信息。请用简洁、友好的方式回答用户的问题。如果需要使用工具获取信息，请主动调用相应的工具。}
  gemini:
    api-key: ${AI_GEMINI_API_KEY:your-api-key-here}
    model-name: gemini-3.5-flash
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://192.168.1.4:11434/v1}
    model-name: ${OLLAMA_MODEL_NAME:qwen3:8b}
    api-key: ${OLLAMA_API_KEY:ollama}
    timeout: 60
spring:
  datasource:
    url: jdbc:mysql://43.143.229.212:3306/agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: agent
    password: ${DB_PASSWORD:agent@123321}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: 43.143.229.212
      port: 6379
      password: ${REDIS_PASSWORD:Redis@123321}
      #mph app used db0
      database: 1

# RAG 知识库配置
rag:
  # 知识库文档目录（启动时自动加载）
  knowledge-base-dir: ${RAG_KNOWLEDGE_DIR:./knowledge-base}
  # 检索返回的最大文档片段数
  max-results: ${RAG_MAX_RESULTS:3}
  # 最低相似度阈值（0-1），低于此值的片段不返回
  min-score: ${RAG_MIN_SCORE:0.3}
  # 文档切分：每个片段的最大 token 数
  chunk-size: ${RAG_CHUNK_SIZE:300}
  # 文档切分：相邻片段的重叠 token 数
  chunk-overlap: ${RAG_CHUNK_OVERLAP:50}

# Milvus 向量数据库配置
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:mph_knowledge}
  # 向量维度，需与 Embedding 模型输出维度一致（AllMiniLmL6V2 = 384）
  dimension: ${MILVUS_DIMENSION:384}

# API 认证配置（国密 SM3 签名验证）
auth:
  # 是否启用 API 认证
  enabled: ${AUTH_ENABLED:true}
  # 签名时间戳容忍窗口（秒），超过此时间的请求将被拒绝
  timestamp-tolerance: ${AUTH_TIMESTAMP_TOLERANCE:300}
  # 默认客户端（启动时自动初始化，首次部署后请修改密钥）
  default-client:
    app-id: ${AUTH_DEFAULT_APP_ID:default}
    app-secret: ${AUTH_DEFAULT_APP_SECRET:default-secret-change-me}
    app-name: 默认客户端
  # 认证白名单路径（不需要认证的接口）
  exclude-paths:
    - /mph/agent/auth/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /swagger-resources/**
    - /webjars/**