server:
  port: 8888
ai:
  # 模型提供商: gemini / ollama
  model:
    provider: ${AI_MODEL_PROVIDER:ollama}
  # 系统提示词（所有接口共用）
  system-prompt: ${AI_SYSTEM_PROMPT:你是一个智能助手，你的名字叫做Clever，能够回答用户的各种问题。你具备以下能力：1. 日常对话和知识问答 2. 使用计算器工具进行数学计算 3. 查询天气信息 4. 查询仓库位置信息。请用简洁、友好的方式回答用户的问题。如果需要使用工具获取信息，请主动调用相应的工具。}
  gemini:
    api-key: ${AI_GEMINI_API_KEY:your-api-key-here}
    model-name: gemini-3.5-flash
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://192.168.1.8:11434/v1}
    model-name: ${OLLAMA_MODEL_NAME:qwen3:8b}
    api-key: ${OLLAMA_API_KEY:ollama}
    timeout: 60
